<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Mughi's Mushroom (MM Pvt Ltd)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; color: #1c1c1e; }
    h1 small { font-size: 0.5em; font-weight: 400; color: #555; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; padding-bottom: 8px; }
    section { margin: 24px 0; }
    .product-row { display: flex; gap: 16px; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; }
    .product-row .name { flex: 1; font-weight: 600; }
    button { padding: 6px 12px; border-radius: 6px; border: 1px solid #888; background: #f4f4f5; cursor: pointer; }
    #spinner { color: #b45309; }
    #cart-count { background: #2563eb; color: #fff; border-radius: 999px; padding: 2px 10px; }
    .recommended { list-style: none; padding: 0; display: flex; gap: 12px; flex-wrap: wrap; }
    .recommended li { border: 1px solid #ddd; border-radius: 8px; padding: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>Mughi's Mushroom <small>(MM Pvt Ltd)</small></h1>
    <div>Cart: <span id="cart-count" data-testid="cart-count">0</span></div>
  </header>

  <section aria-labelledby="rec-h">
    <h2 id="rec-h">Recommended for you</h2>
    <ul class="recommended" id="recommended"></ul>
  </section>

  <section aria-labelledby="prod-h">
    <h2 id="prod-h">Products</h2>
    <p id="loading">Loading products…</p>
    <div id="product-list"></div>
  </section>

  <section aria-labelledby="co-h" id="checkout">
    <h2 id="co-h">Checkout</h2>
    <p id="spinner" data-testid="loading-spinner">Validating cart…</p>
    <ul id="cart-items"></ul>
    <button id="place-order">Place order</button>
    <p id="order-confirmation" role="status" hidden>Order placed!</p>
  </section>

  <section aria-labelledby="su-h">
    <h2 id="su-h">Create account</h2>
    <form id="signup-form">
      <label>Email address <input id="email" type="email" /></label>
      <button type="submit">Sign up</button>
    </form>
    <p id="signup-result" role="status"></p>
  </section>

  <script src="app.js"></script>
</body>
</html>
